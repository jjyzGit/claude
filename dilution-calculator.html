<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dilution Calculator</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: #0a0c10;
    color: #c9d1d9;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    min-height: 100vh;
    display: flex;
    align-items: flex-start;
    justify-content: center;
    padding: 48px 24px;
  }

  .container {
    width: 100%;
    max-width: 760px;
    display: flex;
    flex-direction: column;
    gap: 36px;
  }

  /* Header */
  header {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: 16px;
  }

  .subtitle {
    font-family: 'Courier New', monospace;
    font-size: 11px;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: #6e7681;
    margin-bottom: 6px;
  }

  h1 {
    font-family: 'Courier New', monospace;
    font-size: 22px;
    font-weight: 700;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    color: #e6edf3;
  }

  .badge {
    flex-shrink: 0;
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 6px 12px;
    border-radius: 6px;
    border: 1px solid;
    font-family: 'Courier New', monospace;
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    transition: all 0.15s ease;
    white-space: nowrap;
  }

  .badge.ok   { background: #0d1f17; border-color: #238636; color: #3fb950; }
  .badge.warn { background: #1f0d0d; border-color: #da3633; color: #f85149; }

  hr { border: none; border-top: 1px solid #21262d; }

  /* Input controls */
  .inputs { display: flex; flex-direction: column; gap: 28px; }

  .input-group { display: flex; flex-direction: column; gap: 10px; }

  .input-label-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
  }

  .input-label {
    font-family: 'Courier New', monospace;
    font-size: 11px;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    color: #6e7681;
  }

  .input-value {
    font-family: 'Courier New', monospace;
    font-size: 14px;
    font-weight: 600;
    color: #e6edf3;
  }

  .slider-row {
    display: flex;
    align-items: center;
    gap: 16px;
  }

  input[type=range] {
    flex: 1;
    height: 4px;
    appearance: none;
    background: #21262d;
    border-radius: 2px;
    outline: none;
    cursor: pointer;
  }

  input[type=range]::-webkit-slider-thumb {
    appearance: none;
    width: 16px;
    height: 16px;
    border-radius: 50%;
    background: #58a6ff;
    border: 2px solid #0a0c10;
    cursor: pointer;
    transition: background 0.15s;
  }

  input[type=range]:hover::-webkit-slider-thumb { background: #79c0ff; }

  input[type=number] {
    width: 90px;
    padding: 6px 10px;
    background: #161b22;
    border: 1px solid #30363d;
    border-radius: 6px;
    color: #e6edf3;
    font-family: 'Courier New', monospace;
    font-size: 13px;
    text-align: right;
    outline: none;
    transition: border-color 0.15s;
  }

  input[type=number]:focus { border-color: #58a6ff; }
  input[type=number]::-webkit-inner-spin-button { opacity: 0.5; }

  /* Results grid */
  .results {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 16px;
  }

  .result-card {
    display: flex;
    flex-direction: column;
    padding: 20px;
    border-radius: 8px;
    border: 1px solid #21262d;
    background: #161b22;
    transition: border-color 0.2s;
  }

  .result-card.ownership-ok   { border-color: #238636; }
  .result-card.ownership-warn { border-color: #da3633; }
  .result-card.status-ok      { border-color: #238636; }
  .result-card.status-warn    { border-color: #da3633; }

  .card-label {
    font-family: 'Courier New', monospace;
    font-size: 10px;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    margin-bottom: 14px;
  }

  .card-label.ok   { color: #3fb950; }
  .card-label.warn { color: #f85149; }
  .card-label.neutral { color: #6e7681; }

  .card-number {
    font-family: 'Courier New', monospace;
    font-size: 40px;
    font-weight: 700;
    line-height: 1;
    margin-bottom: 8px;
    transition: color 0.2s;
  }

  .card-number.ok   { color: #3fb950; }
  .card-number.warn { color: #f85149; }
  .card-number.neutral { color: #e6edf3; }

  .card-sub {
    font-family: 'Courier New', monospace;
    font-size: 11px;
    color: #6e7681;
    margin-top: auto;
  }

  .status-title {
    font-family: 'Courier New', monospace;
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    margin-bottom: 10px;
  }

  .status-title.ok   { color: #3fb950; }
  .status-title.warn { color: #f85149; }

  .status-body {
    font-family: 'Courier New', monospace;
    font-size: 11px;
    line-height: 1.6;
    color: #8b949e;
  }

  @media (max-width: 560px) {
    .results { grid-template-columns: 1fr; }
    .card-number { font-size: 32px; }
  }
</style>
</head>
<body>
<div class="container">

  <header>
    <div>
      <div class="subtitle">Funding Round Simulation</div>
      <h1>Dilution Calculator</h1>
    </div>
    <div class="badge ok" id="badge">
      <span id="badge-icon">●</span>
      <span id="badge-text">WITHIN LIMIT</span>
    </div>
  </header>

  <hr>

  <div class="inputs">
    <div class="input-group">
      <div class="input-label-row">
        <span class="input-label">Investment Amount</span>
        <span class="input-value" id="inv-display">$2.5M</span>
      </div>
      <div class="slider-row">
        <input type="range" id="inv-slider" min="1" max="5" step="0.1" value="2.5">
        <input type="number"  id="inv-input"  min="1" max="5" step="0.1" value="2.5">
      </div>
    </div>

    <div class="input-group">
      <div class="input-label-row">
        <span class="input-label">Post-Money Valuation</span>
        <span class="input-value" id="pm-display">$12.0M</span>
      </div>
      <div class="slider-row">
        <input type="range" id="pm-slider" min="8" max="25" step="0.5" value="12">
        <input type="number"  id="pm-input"  min="8" max="25" step="0.5" value="12">
      </div>
    </div>
  </div>

  <hr>

  <div class="results">
    <div class="result-card ownership-ok" id="card-ownership">
      <div class="card-label neutral">Investor Ownership</div>
      <div class="card-number ok" id="ownership-num">20.8%</div>
      <div class="card-sub" id="ownership-sub">of $12.0M post-money</div>
    </div>

    <div class="result-card" id="card-premoney">
      <div class="card-label neutral">Pre-Money Valuation</div>
      <div class="card-number neutral" id="premoney-num">$9.5M</div>
      <div class="card-sub">post-money − investment</div>
    </div>

    <div class="result-card status-ok" id="card-status">
      <div class="status-title ok" id="status-title">✓ WITHIN CAP</div>
      <div class="status-body" id="status-body">
        Ownership is within the 20% dilution cap. The terms are acceptable.
      </div>
    </div>
  </div>

</div>

<script>
  const INV_MIN = 1, INV_MAX = 5, PM_MIN = 8, PM_MAX = 25;
  const CAP = 20;

  const invSlider  = document.getElementById('inv-slider');
  const invInput   = document.getElementById('inv-input');
  const pmSlider   = document.getElementById('pm-slider');
  const pmInput    = document.getElementById('pm-input');

  function clamp(v, min, max) { return Math.min(max, Math.max(min, v)); }
  function fmt1(v) { return v.toFixed(1); }

  function update() {
    const inv = parseFloat(invSlider.value);
    const pm  = parseFloat(pmSlider.value);

    const ownership = (inv / pm) * 100;
    const preMoney  = pm - inv;
    const exceeded  = ownership > CAP;

    // Sync inputs
    invInput.value = fmt1(inv);
    pmInput.value  = fmt1(pm);

    // Header displays
    document.getElementById('inv-display').textContent = `$${fmt1(inv)}M`;
    document.getElementById('pm-display').textContent  = `$${fmt1(pm)}M`;

    // Badge
    const badge = document.getElementById('badge');
    badge.className = `badge ${exceeded ? 'warn' : 'ok'}`;
    document.getElementById('badge-icon').textContent = exceeded ? '▲' : '●';
    document.getElementById('badge-text').textContent = exceeded ? 'EXCEEDS 20% CAP' : 'WITHIN LIMIT';

    // Ownership card
    const ownershipCard = document.getElementById('card-ownership');
    const ownershipNum  = document.getElementById('ownership-num');
    ownershipCard.className = `result-card ${exceeded ? 'ownership-warn' : 'ownership-ok'}`;
    ownershipNum.className  = `card-number ${exceeded ? 'warn' : 'ok'}`;
    ownershipNum.textContent = `${fmt1(ownership)}%`;
    document.getElementById('ownership-sub').textContent = `of $${fmt1(pm)}M post-money`;

    // Pre-money card
    document.getElementById('premoney-num').textContent = `$${fmt1(preMoney)}M`;

    // Status card
    const statusCard  = document.getElementById('card-status');
    const statusTitle = document.getElementById('status-title');
    const statusBody  = document.getElementById('status-body');
    statusCard.className  = `result-card ${exceeded ? 'status-warn' : 'status-ok'}`;
    statusTitle.className = `status-title ${exceeded ? 'warn' : 'ok'}`;
    statusBody.textContent = exceeded
      ? 'Investor ownership exceeds the 20% dilution threshold. Reduce the investment or increase the post-money valuation.'
      : 'Ownership is within the 20% dilution cap. The terms are acceptable.';
    statusTitle.textContent = exceeded ? '⚠ DILUTION CAP BREACHED' : '✓ WITHIN CAP';
  }

  invSlider.addEventListener('input', () => { invInput.value = invSlider.value; update(); });
  pmSlider.addEventListener('input',  () => { pmInput.value  = pmSlider.value;  update(); });

  invInput.addEventListener('change', () => {
    invSlider.value = fmt1(clamp(parseFloat(invInput.value) || INV_MIN, INV_MIN, INV_MAX));
    update();
  });
  pmInput.addEventListener('change', () => {
    pmSlider.value = fmt1(clamp(parseFloat(pmInput.value) || PM_MIN, PM_MIN, PM_MAX));
    update();
  });

  update();
</script>
</body>
</html>
